[pytest]
# Collects both suites in one process, from the repo root.
#
# pythonpath carries the API package, the distiller module, and the KWIM client
# the distiller imports.
pythonpath =
    services/api
    services/distiller
    clients/python

testpaths =
    services/api/tests
    services/distiller/tests

asyncio_mode = auto
# Coroutine tests are auto-detected (asyncio_mode=auto) - no @pytest.mark.asyncio needed.
timeout = 60
addopts = -ra --tb=short
