# KWIM tunables - shipped defaults. DO NOT edit this file to customize a
# deployment: it is the base layer and may be overwritten on upgrade. Instead
# point KWIM_CONFIG at your own YAML; its keys are deep-merged over these, and
# any matching env var overrides both (precedence: env > KWIM_CONFIG > this file).
#
# Secrets and connection endpoints are not here by design - they stay as discrete
# env vars sourced from k8s Secrets (KWIM_PG_*, KWIM_*_PASSWORD, KWIM_API_KEYS,
# KWIM_*_KEYS, KWIM_MM_*, KWIM_EMBEDDER_URL, KWIM_SERVICE_URL, OTEL_*). See config.py.

gate:
  # Auto-commit at session_count >= threshold; below it, route to human review.
  auto_commit_threshold: 3
  # Cosine distance (0 = identical). dup -> drop as duplicate; review -> queue.
  dup_distance: 0.05
  review_distance: 0.25
  # Kill switch for the verify screen (evidence integrity + embedding dedup).
  verify_enabled: true
  # Max chars of a proposal summary echoed into review notifications.
  summary_max: 500

decay:
  # Freshness half-lives, env-tunable (KWIM_DECAY_HALFLIFE_SLOW / _FAST).
  halflife_slow_days: 90
  halflife_fast_hours: 48

embedder:
  # all-MiniLM-L6-v2 is 384-d. Changing this must match the embedder image and
  # forces a rebuild (the FalkorDB vector indexes are created at this dimension).
  dim: 384
  timeout_s: 10.0

retrieval:
  episodic_max_limit: 2000      # hard cap on a single episodic-window page
  episodic_default_limit: 500   # default page size when caller omits ?limit
  rule_query_limit: 20          # rules packed into warm-start context
  fact_query_limit: 20          # facts packed into warm-start context
  rule_scan_limit: 200          # rule scans for /check and promotion source lookup
  code_slot_limit: 8            # code-graph warm-start slot size (small for weak models)
  # Cosine-distance cutoff for the semantic half of memory/context's knowledge slot.
  # An unbounded KNN always returns its k nearest, however unrelated, so without a
  # cutoff every warm start carries noise. Applies to memory/context only -
  # knowledge/search returns scores and lets the caller judge.
  #
  # Calibrated against live canon facts and real agent questions.
  # When the question names the entity - the common case - the right fact lands at
  # 0.25-0.55 and the next-best is 0.63+, so 0.6 admits exactly one fact, the right
  # one. Loosening to 0.85 to rescue entity-free paraphrases (which land at
  # 0.70-0.79) costs more than it buys: it also admits a wrong fact on most named
  # questions. The two ranges overlap, so no single threshold separates them -
  # paraphrase recall needs a margin-relative rule, not a looser cutoff.
  # Re-measure before changing this, and re-check if the embedder model changes.
  context_semantic_max_dist: 0.6

rebuild:
  embed_batch: 32               # episodic re-embed batch size during rebuild

messaging:
  rmq_exchange: kwim            # RabbitMQ topic exchange name
  universe_graph: universe      # reserved pseudo-team -> shared kwim_universe graph

codegraph:
  min_fan_in: 5                 # inbound-CALLS threshold for "load-bearing" hubs
  min_confidence: 0.75          # distiller edge floor (hubs + cross-repo interfaces)
  community_min_confidence: 0.5 # Louvain edge floor (drop fuzzy guesses)
  arch_top_hubs: 8              # hubs named in a repo's architecture summary fact
  min_bridged_communities: 3    # min distinct caller communities for a cross-module seam
  interface_query_limit: 100    # max cross-repo interface facts proposed per run
  # Call-resolution confidence cascade (resolve.py). Higher = more certain edge.
  resolution:
    import_map: 0.95
    import_map_suffix: 0.85
    same_class: 0.92
    same_module: 0.90
    qualified_suffix: 0.90
    unique_name: 0.75
    suffix_match: 0.55
    fuzzy_single: 0.40
    fuzzy_multi: 0.30
    max_candidates: 20          # above this many same-name candidates -> unresolved
  # Source-discovery scope for the extractor (incremental.py).
  discovery:
    lang_by_ext:
      ".py": python
    skip_dirs:
      - .git
      - .venv
      - venv
      - __pycache__
      - .pytest_cache
      - node_modules
      - .mypy_cache
      - .ruff_cache
      - dist
      - build
      - .tox
      - tests
      - test
    ignore_files:
      - .gitignore
      - .cgignore
