[pytest]
# Run from the service/ directory: `.venv/bin/python -m pytest`
# pythonpath=. puts the service root on sys.path so `import app...` resolves
# without the per-file sys.path.insert hacks the old script-style tests used.
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Coroutine tests are auto-detected (asyncio_mode=auto) - no @pytest.mark.asyncio needed.
timeout = 60
addopts = -ra --tb=short
