[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kwim-client"
dynamic = ["version"]            # version is derived from git tags via setuptools-scm
description = "KWIM Python client (episodic read + knowledge/wisdom propose + LLM factory)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

# `make_llm` builds a langchain ChatOpenAI, but the import is lazy so the base
# client stays httpx-only. Consumers that call make_llm install `kwim-client[llm]`
# (or already have langchain-openai from their own requirements).
[project.optional-dependencies]
llm = ["langchain-openai>=0.1"]

# Flat top-level modules so `import kwim` / `from secret_reader import read_secret`
# / `from llm_router import make_llm` resolve unchanged for existing consumers
# (agents, the distiller).
[tool.setuptools]
py-modules = ["kwim", "secret_reader", "llm_router"]

# Version is derived from git tags. Release by pushing a component-prefixed tag:
#   git tag kwim-client-v0.2.0 && git push origin kwim-client-v0.2.0
[tool.setuptools_scm]
# The package builds from clients/python, but .git is at the repo root (two levels up).
root = "../.."
# Consider only this component's tags (ignore distiller-v*, embedder-v*, ... in the monorepo).
git_describe_command = "git describe --dirty --tags --long --match kwim-client-v*"
tag_regex = "^kwim-client-v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
local_scheme = "no-local-version"
# Let a tagless dev checkout still build (pip install -e .) instead of erroring.
fallback_version = "0.0.0"
