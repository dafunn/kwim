---
# Embedder: TEI on CPU serving all-MiniLM-L6-v2 (384 dimensions), model in the
# image, no Hugging Face Hub access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder
  namespace: kwim
  labels:
    app: embedder
    app.kubernetes.io/name: embedder
    app.kubernetes.io/part-of: kwim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedder
  template:
    metadata:
      labels:
        app: embedder
        app.kubernetes.io/name: embedder
        app.kubernetes.io/part-of: kwim
    spec:
      # Add imagePullSecrets here (or via an overlay) if your registry is private.
      containers:
        - name: embedder
          # Bare image name; set registry + tag via the `images:` transformer in your overlay.
          image: kwim-embedder:latest
          # --auto-truncate: embed the first 256 tokens of longer inputs instead of
          # rejecting them. See docs/DESIGN.md, "Semantic memory".
          args:
            - --model-id
            - /models/all-MiniLM-L6-v2
            - --auto-truncate
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
            # OTLP endpoint for TEI's gRPC exporter (needs the http:// scheme); unset
            # by default.
            - { name: OTLP_ENDPOINT, value: "" }
            - { name: OTLP_SERVICE_NAME, value: "kwim-embedder" }
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: embedder
  namespace: kwim
  labels:
    app: embedder
    app.kubernetes.io/name: embedder
    app.kubernetes.io/part-of: kwim
spec:
  type: ClusterIP
  selector:
    app: embedder
  ports:
    - name: http
      port: 80
      targetPort: 80
