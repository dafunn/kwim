---
# KWIM namespace, shared by all components. Teams are separated inside the stores
# (see docs/ARCHITECTURE.md, "Tenancy").
apiVersion: v1
kind: Namespace
metadata:
  name: kwim
  labels:
    app.kubernetes.io/name: kwim
    app.kubernetes.io/part-of: kwim
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falkordb
  namespace: kwim
  labels:
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/part-of: kwim
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kwim-service
  namespace: kwim
  labels:
    app.kubernetes.io/name: kwim-service
    app.kubernetes.io/part-of: kwim
