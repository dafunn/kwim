---
# FalkorDB - KWIM Knowledge layer (graph store).
#
# Redis protocol on :6379; one graph per team. Single primary.
#
# AUTH: requirepass from the `falkordb-auth` Secret; the Service is ClusterIP.
#
# PERSISTENCE: AOF on the PVC at /var/lib/falkordb/data. No maxmemory policy, so
# a full store errors (`noeviction`) rather than evicting facts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falkordb
  namespace: kwim
  labels:
    app: falkordb
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/part-of: kwim
spec:
  serviceName: falkordb-headless
  replicas: 1
  selector:
    matchLabels:
      app: falkordb
  template:
    metadata:
      labels:
        app: falkordb
        app.kubernetes.io/name: falkordb
        app.kubernetes.io/part-of: kwim
    spec:
      # Stateful single-primary. If your storage class is node-bound,
      # pin this to a node with a nodeSelector in your overlay.
      serviceAccountName: falkordb
      enableServiceLinks: false
      containers:
        - name: falkordb
          image: falkordb/falkordb:v4.18.9
          env:
            # Password from the falkordb-auth Secret; referenced by REDIS_ARGS below.
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: falkordb-auth
                  key: value
            # k8s expands $(FALKORDB_PASSWORD) because it's declared earlier.
            # AOF persistence on; no eviction policy (see header).
            - name: REDIS_ARGS
              value: "--requirepass $(FALKORDB_PASSWORD) --appendonly yes --appendfsync everysec"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
          resources:
            requests:
              # In-memory, including the code graphs; raise as more repos are indexed.
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Headless service backing the StatefulSet (stable pod DNS).
apiVersion: v1
kind: Service
metadata:
  name: falkordb-headless
  namespace: kwim
  labels:
    app: falkordb
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/part-of: kwim
spec:
  clusterIP: None
  selector:
    app: falkordb
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# In-cluster endpoint: redis://falkordb:6379
apiVersion: v1
kind: Service
metadata:
  name: falkordb
  namespace: kwim
  labels:
    app: falkordb
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/part-of: kwim
spec:
  type: ClusterIP
  selector:
    app: falkordb
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
