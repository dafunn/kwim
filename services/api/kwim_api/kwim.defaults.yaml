# KWIM tunables: the shipped defaults. Customize with your own YAML in
# KWIM_CONFIG, deep-merged over these; environment variables override both.
# Secrets and connection settings are environment variables only (see config.py).

gate:
  # Auto-commit at session_count >= threshold; below it, route to human review.
  auto_commit_threshold: 3
  # Cosine distance (0 = identical). dup -> drop as duplicate; review -> queue.
  dup_distance: 0.05
  review_distance: 0.25
  # Kill switch for the verify screen (evidence integrity + embedding dedup).
  verify_enabled: true
  # Max chars of a proposal summary echoed into review notifications.
  summary_max: 500

postgres:
  # Connection pool per store (PostgresStore, AdminStore).
  pool_min_size: 1
  pool_max_size: 4
  pool_timeout_s: 30.0          # max wait for a free connection before the request fails

decay:
  # Freshness half-lives, env-tunable (KWIM_DECAY_HALFLIFE_SLOW / _FAST).
  halflife_slow_days: 90
  halflife_fast_hours: 48

embedder:
  # Must match the embedder's model; changing it requires rebuilding every graph.
  dim: 384
  timeout_s: 10.0

retrieval:
  episodic_max_limit: 2000      # hard cap on a single episodic-window page
  episodic_default_limit: 500   # default page size when caller omits ?limit
  rule_query_limit: 20          # rules packed into warm-start context
  fact_query_limit: 20          # facts packed into warm-start context
  rule_scan_limit: 200          # rule scans for /check and promotion source lookup
  code_slot_limit: 8            # code-graph warm-start slot size (small for weak models)
  # Cosine-distance cutoff for memory/context's semantic matches. How it was
  # chosen: docs/DESIGN.md, "Retrieval".
  context_semantic_max_dist: 0.6

rebuild:
  embed_batch: 32               # episodic re-embed batch size during rebuild

admin:
  # Hard off switch for the whole /v1/admin surface (KWIM_ADMIN_ENABLED).
  enabled: false
  # How long auth.py caches a resolved kwim_admin.api_keys row in-process before
  # re-querying. Correct only at replicas: 1.
  key_cache_ttl_seconds: 30
  # false for deployments without TLS; see docs/DESIGN.md, "Operators".
  secure_cookie: true
  session_ttl_hours: 12
  session_max_age_days: 7
  login_max_failures: 5
  login_lockout_minutes: 15
  # Hard off switches for team lifecycle routes (KWIM_ADMIN_ALLOW_TEAM_CREATE /
  # KWIM_ADMIN_ALLOW_TEAM_DESTROY).
  allow_team_create: true
  allow_team_destroy: false

messaging:
  rmq_exchange: kwim            # RabbitMQ topic exchange name
  universe_graph: universe      # reserved pseudo-team -> shared kwim_universe graph

codegraph:
  min_fan_in: 5                 # inbound-CALLS threshold for "load-bearing" hubs
  min_confidence: 0.75          # distiller edge floor (hubs + cross-repo interfaces)
  community_min_confidence: 0.5 # Louvain edge floor (drop fuzzy guesses)
  arch_top_hubs: 8              # hubs named in a repo's architecture summary fact
  min_bridged_communities: 3    # min distinct caller communities for a cross-module seam
  interface_query_limit: 100    # max cross-repo interface facts proposed per run
  # Call-resolution confidence cascade (resolve.py). Higher = more certain edge.
  resolution:
    import_map: 0.95
    import_map_suffix: 0.85
    same_class: 0.92
    same_module: 0.90
    qualified_suffix: 0.90
    unique_name: 0.75
    suffix_match: 0.55
    fuzzy_single: 0.40
    fuzzy_multi: 0.30
    max_candidates: 20          # above this many same-name candidates -> unresolved
  # Source-discovery scope for the extractor (incremental.py).
  discovery:
    lang_by_ext:
      ".py": python
    skip_dirs:
      - .git
      - .venv
      - venv
      - __pycache__
      - .pytest_cache
      - node_modules
      - .mypy_cache
      - .ruff_cache
      - dist
      - build
      - .tox
      - tests
      - test
    ignore_files:
      - .gitignore
      - .cgignore
